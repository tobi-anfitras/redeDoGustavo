<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rede tobistica</title>
  
  <!-- SDK oficial do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace }
    body { background-color: #000; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { margin-bottom: 16px; color: #ff0000; }
    
    /* Container para os botões do topo */
    .acoes-topo {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-acao {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }
    .btn-acao:active { transform: scale(0.98); }

    .btn-novo-post { background: #000000; box-shadow: 2px 2px 0px #006a71;border: 2px solid #ff0000 }
    .btn-pesquisar { background: #000000; box-shadow: 2px 2px 0px #a10061;border: 2px solid #ff0000 }

    /* Containers dinâmicos */
    #form-container, #search-container {
      width: 100%;
      max-width: 450px;
      margin-bottom: 20px;
    }

    /* Estilo genérico dos cards de formulários */
    .form-card {
      background: rgb(0, 0, 0);
      border: 2px solid #ff0000;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 4px 4px 0px #8e0000;
    }

    .form-card input, .form-card textarea {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid #ef0000;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #000;
      color: #fff;
    }

    .form-card textarea { resize: vertical; min-height: 70px; }

    .form-acoes {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-cancelar {
      background: #e5e7eb;
      border: 2px solid #222;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #000;
    }

    .btn-enviar {
      background: #ff0000;
      color: white;
      border: 2px solid #222;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Feedback do Filtro Ativo */
    .filtro-ativo {
      background: #e0e7ff;
      border: 2px solid #4338ca;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 450px;
      font-weight: bold;
      color: #3730a3;
    }

    .btn-limpar-filtro {
      background: transparent;
      border: none;
      color: #ef4444;
      font-weight: bold;
      cursor: pointer;
    }

    #feed {  
      display: grid; 
      grid-template-columns: repeat(2, 1fr);
      gap: 20px; 
      width: 100%; 
      max-width: 900px;
    }

    @media (max-width: 600px) {
      #feed { grid-template-columns: 1fr; }
    }

    /* Card da Postagem */
    .card {
      background: rgb(0, 0, 0);
      border: 2px solid #ff2b2b;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 4px 4px 0px #970c0c;
      color: rgb(248, 0, 0);
    }

    .box {
      border: 2px solid #ff0000;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .emoji-box { font-size: 2.5rem; background: #fff; }
    .texto-box { font-size: 1.1rem; color: #ff0000; text-align: left; }
    .hashtags-box { color: #ff8175; font-size: 0.9rem; font-weight: bold; }

    .likes-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .btn-like {
      background: #ff0015;
      color: rgb(0, 0, 0);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-like:active { transform: scale(0.95); }
    
    .btn-like:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      transform: none;
    }

    .btn-editar {
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }
    .btn-editar:active { transform: scale(0.95); }

    .comentarios-box {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lista-comentarios {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    .lista-comentarios li {
      background: #f1f2f6;
      color: #000;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .form-comentario { display: flex; gap: 6px; }
    .form-comentario input {
      flex: 1;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #000;
    }
    .form-comentario button {
      padding: 6px 12px;
      border: none;
      background: #222;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>rede fodastica ❌</h1>
  
  <div class="acoes-topo">
    <button class="btn-acao btn-novo-post" onclick="toggleFormulario()">+ Nova Postagem</button>
    <button class="btn-acao btn-pesquisar" onclick="togglePesquisa()">🔍 Pesquisar</button>
  </div>
  
  <div id="form-container"></div>
  <div id="search-container"></div>
  <div id="filtro-container"></div>

  <div id="feed">Carregando postagens...</div>

  <script>
    const SUPABASE_URL = "https://satkyjdqreylqhdqjhnu.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_W2LesgIfqiJVlRK9tqqQDA_aqfIse9Q";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const feedEl = document.getElementById("feed");
    const formContainerEl = document.getElementById("form-container");
    const searchContainerEl = document.getElementById("search-container");
    const filtroContainerEl = document.getElementById("filtro-container");

    let hashtagAtual = null;

    // --- MÉTODOS DE CONTROLE DO LOCALSTORAGE ---
    function getCurtidasLocais() {
      const curtidas = localStorage.getItem("curtidas_mural");
      return curtidas ? JSON.parse(curtidas) : [];
    }

    function salvarCurtidaLocal(id) {
      const curtidas = getCurtidasLocais();
      if (!curtidas.includes(id)) {
        curtidas.push(id);
        localStorage.setItem("curtidas_mural", JSON.stringify(curtidas));
      }
    }

    // Alterna o formulário de criação
    function toggleFormulario() {
      searchContainerEl.innerHTML = "";
      if (formContainerEl.innerHTML !== "") {
        formContainerEl.innerHTML = "";
        return;
      }

      formContainerEl.innerHTML = `
        <form class="form-card" onsubmit="criarPostagem(event)">
          <input type="text" id="input-emoji" placeholder="Emoji (ex: 😍, 🚀, 🤡)" maxlength="50" required />
          <textarea id="input-texto" placeholder="O que você está pensando?" required></textarea>
          <input type="text" id="input-hashtags" placeholder="Hashtags separadas por espaço (ex: #dev #supabase)" />
          <input type="password" id="input-login" placeholder="Crie uma senha para editar esta postagem" required />
          
          <div class="form-acoes">
            <button type="button" class="btn-cancelar" onclick="toggleFormulario()">Cancelar</button>
            <button type="submit" class="btn-enviar">Publicar</button>
          </div>
        </form>
      `;
    }

    // Alterna o formulário de pesquisa
    function togglePesquisa() {
      formContainerEl.innerHTML = "";
      if (searchContainerEl.innerHTML !== "") {
        searchContainerEl.innerHTML = "";
        return;
      }

      searchContainerEl.innerHTML = `
        <form class="form-card" onsubmit="executarPesquisa(event)">
          <input type="text" id="input-busca-hashtag" placeholder="Digite a hashtag (ex: #dev ou dev)" required />
          <div class="form-acoes">
            <button type="button" class="btn-cancelar" onclick="togglePesquisa()">Cancelar</button>
            <button type="submit" class="btn-enviar" style="background:#8b5cf6;">Buscar</button>
          </div>
        </form>
      `;
    }

    // Executa o filtro de busca
    function executarPesquisa(event) {
      event.preventDefault();
      let term = document.getElementById("input-busca-hashtag").value.trim();
      
      if (!term.startsWith('#')) {
        term = '#' + term;
      }

      hashtagAtual = term;
      searchContainerEl.innerHTML = "";
      carregarPostagens();
    }

    // Limpa a busca e volta ao feed normal
    function limparFiltro() {
      hashtagAtual = null;
      filtroContainerEl.innerHTML = "";
      carregarPostagens();
    }

    // Envia o novo post para o Supabase
    async function criarPostagem(event) {
      event.preventDefault();

      const emoji = document.getElementById("input-emoji").value.trim();
      const texto = document.getElementById("input-texto").value.trim();
      const hashtagsRaw = document.getElementById("input-hashtags").value.trim();
      const login = document.getElementById("input-login").value.trim();
      
      const hashtags = hashtagsRaw
        ? hashtagsRaw.split(" ")
            .filter(h => h.length > 0)
            .map(h => h.startsWith('#') ? h : '#' + h)
        : [];

      const { error } = await supabaseClient
        .from("postagens")
        .insert([{ emoji, texto, hashtags, login }]);

      if (error) {
        alert("Erro ao criar postagem!");
        console.error(error);
        return;
      }

      formContainerEl.innerHTML = "";
      carregarPostagens();
    }

    // Inicia a edição do post exigindo a verificação de senha
    async function iniciarEdicao(id) {
      const senhaInformada = prompt("Digite a senha desta postagem para editá-la:");

      if (!senhaInformada) return;

      // Consulta no Supabase se a senha (coluna login) bate com a postagem
      const { data: post, error } = await supabaseClient
        .from("postagens")
        .select("*")
        .eq("id", id)
        .single();

      if (error || !post) {
        alert("Erro ao verificar a postagem!");
        return;
      }

      if (post.login !== senhaInformada) {
        alert("Senha incorreta!");
        return;
      }

      // Se a senha estiver correta, abre o formulário de edição
      searchContainerEl.innerHTML = "";
      const hashtagsTexto = post.hashtags ? post.hashtags.join(" ") : "";

      formContainerEl.innerHTML = `
        <form class="form-card" onsubmit="salvarEdicao(event, ${post.id})">
          <h3 style="color:#ff0000; text-align:center;">Editar Postagem</h3>
          <input type="text" id="edit-emoji" value="${post.emoji || ''}" placeholder="Emoji" maxlength="50" required />
          <textarea id="edit-texto" placeholder="Texto" required>${post.texto || ''}</textarea>
          <input type="text" id="edit-hashtags" value="${hashtagsTexto}" placeholder="Hashtags" />
          
          <div class="form-acoes">
            <button type="button" class="btn-cancelar" onclick="formContainerEl.innerHTML=''">Cancelar</button>
            <button type="submit" class="btn-enviar">Salvar Alterações</button>
          </div>
        </form>
      `;

      // Rola até o topo para facilitar a visualização do formulário
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Salva a edição do post no Supabase
    async function salvarEdicao(event, id) {
      event.preventDefault();

      const emoji = document.getElementById("edit-emoji").value.trim();
      const texto = document.getElementById("edit-texto").value.trim();
      const hashtagsRaw = document.getElementById("edit-hashtags").value.trim();

      const hashtags = hashtagsRaw
        ? hashtagsRaw.split(" ")
            .filter(h => h.length > 0)
            .map(h => h.startsWith('#') ? h : '#' + h)
        : [];

      const { error } = await supabaseClient
        .from("postagens")
        .update({ emoji, texto, hashtags })
        .eq("id", id);

      if (error) {
        alert("Erro ao atualizar postagem!");
        console.error(error);
        return;
      }

      alert("Postagem atualizada com sucesso!");
      formContainerEl.innerHTML = "";
      carregarPostagens();
    }

    // Busca os posts no banco (com ou sem filtro)
    async function carregarPostagens() {
      let query = supabaseClient
        .from("postagens")
        .select("*")
        .order("created_at", { ascending: false });

      if (hashtagAtual) {
        query = query.contains("hashtags", [hashtagAtual]);
        
        filtroContainerEl.innerHTML = `
          <div class="filtro-ativo">
            <span>Filtrando por: ${hashtagAtual}</span>
            <button class="btn-limpar-filtro" onclick="limparFiltro()">Limpar ✖</button>
          </div>
        `;
      } else {
        filtroContainerEl.innerHTML = "";
      }

      const { data: postagens, error } = await query;

      if (error) {
        feedEl.innerHTML = "<p>Erro ao carregar postagens.</p>";
        console.error(error);
        return;
      }

      if (postagens.length === 0) {
        feedEl.innerHTML = "<p>Nenhuma postagem encontrada com esses critérios.</p>";
        return;
      }

      // Obtém as curtidas salvas nesta máquina
      const curtidasLocais = getCurtidasLocais();

      feedEl.innerHTML = "";
      postagens.forEach(post => {
        const card = document.createElement("div");
        card.className = "card";

        const hashtagsTexto = post.hashtags ? post.hashtags.join(" ") : "";
        const listaComentariosHTML = (post.comentarios || [])
          .map(c => `<li>${c}</li>`)
          .join("");

        // Checa se o post atual já foi curtido localmente
        const jaCurtido = curtidasLocais.includes(post.id);

        card.innerHTML = `
          <div class="box emoji-box">${post.emoji || '❤️'}</div>
          <div class="box texto-box">${post.texto}</div>
          <div class="box hashtags-box">${hashtagsTexto}</div>
          
          <div class="box likes-box">
            <span>❤️ ${post.likes || 0} Likes</span>
            <button 
              class="btn-like" 
              onclick="curtirPost(${post.id}, ${post.likes || 0})"
              ${jaCurtido ? 'disabled' : ''}
            >
              ${jaCurtido ? 'Curtido' : 'Curtir'}
            </button>
          </div>

          <button class="btn-editar" onclick="iniciarEdicao(${post.id})">✏️ Editar Postagem</button>

          <div class="box comentarios-box">
            <strong>Comentários:</strong>
            <ul class="lista-comentarios">${listaComentariosHTML}</ul>
            <form class="form-comentario" onsubmit="adicionarComentario(event, ${post.id}, ${JSON.stringify(post.comentarios || []).replace(/"/g, '&quot;')})">
              <input type="text" placeholder="Comentar..." required />
              <button type="submit">Enviar</button>
            </form>
          </div>
        `;

        feedEl.appendChild(card);
      });
    }

    async function curtirPost(id, likesAtuais) {
      const curtidasLocais = getCurtidasLocais();
      if (curtidasLocais.includes(id)) return;

      const { error } = await supabaseClient
        .from("postagens")
        .update({ likes: likesAtuais + 1 })
        .eq("id", id);

      if (!error) {
        salvarCurtidaLocal(id);
        carregarPostagens();
      }
    }

    async function adicionarComentario(event, id, comentariosAtuais) {
      event.preventDefault();
      const input = event.target.querySelector("input");
      const novoComentario = input.value.trim();

      if (!novoComentario) return;

      const { error } = await supabaseClient
        .from("postagens")
        .update({ comentarios: [...comentariosAtuais, novoComentario] })
        .eq("id", id);

      if (!error) carregarPostagens();
    }

    carregarPostagens();
  </script>
</body>
</html>
